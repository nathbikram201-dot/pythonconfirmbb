<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLIENT-PAPA Status</title><style>body{font:16px system-ui;background:#101522;color:#eef2ff;max-width:650px;margin:40px auto;padding:18px}section{background:#1c2638;padding:22px;border-radius:14px}input,button{box-sizing:border-box;padding:12px;border-radius:8px;border:0;margin:5px 0;width:100%}button{background:#77e0bd;font-weight:bold;cursor:pointer}code{overflow-wrap:anywhere}</style></head><body><section><h1>FLIENT-PAPA Backend Check</h1><p>Basic status page; it is not an authenticated admin panel.</p><label>Render backend URL</label><input id="url" placeholder="https://your-service.onrender.com"><button onclick="check()">Check backend</button><pre id="result">Enter your backend URL.</pre></section><script>async function check(){let u=document.getElementById('url').value.trim().replace(/\/$/,'');let o=document.getElementById('result');if(!u){o.textContent='Enter the Render URL first.';return}try{let r=await fetch(u+'/health');o.textContent='HTTP '+r.status+'\n'+await r.text()}catch(e){o.textContent='Could not reach backend. '+e}}</script></body></html>
